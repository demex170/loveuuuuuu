<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My View ✨</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #09090e;
            color: #ffffff;
            padding: 25px;
            overflow: hidden;
        }

        .ambient-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(244,63,94,0.15) 0%, rgba(147,51,234,0.1) 70%, transparent 100%);
            filter: blur(90px);
            pointer-events: none;
        }

        .dashboard {
            position: relative;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .title-box h2 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #f1f5f9;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-dot.online {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            transition: opacity 0.5s ease;
        }

        .placeholder-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #64748b;
            text-align: center;
            padding: 20px;
        }

        .placeholder-icon {
            font-size: 2.5rem;
            opacity: 0.5;
        }

        .placeholder-text {
            font-size: 0.95rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="dashboard">
        <div class="header">
            <div class="title-box">
                <h2>Her Smile ✨</h2>
            </div>
            <div class="status-pill">
                <span class="status-dot" id="adminStatusDot"></span>
                <span id="adminStatusText">Offline</span>
            </div>
        </div>

        <div class="video-wrapper">
            <div class="placeholder-content" id="placeholder">
                <div class="placeholder-icon">🌸</div>
                <div class="placeholder-text">ელოდება საიტზე შემოსვლას...</div>
            </div>
            <video id="partnerVideo" autoplay playsinline muted style="opacity: 0;"></video>
        </div>
    </div>

    <script>
        const ADMIN_PEER_ID = 'deme-admin-secret-key-123';
        const videoEl = document.getElementById('partnerVideo');
        const placeholder = document.getElementById('placeholder');
        const statusDot = document.getElementById('adminStatusDot');
        const statusText = document.getElementById('adminStatusText');

        let myAudioStream = null;

        navigator.mediaDevices.getUserMedia({ video: false, audio: true })
            .then(stream => {
                myAudioStream = stream;
            })
            .catch(err => console.log('Microphone error/denied:', err));

        const peer = new Peer(ADMIN_PEER_ID, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('call', (call) => {
            call.answer(myAudioStream);

            call.on('stream', (remoteStream) => {
                placeholder.style.display = 'none';
                videoEl.srcObject = remoteStream;
                videoEl.style.opacity = '1';
                
                statusDot.classList.add('online');
                statusText.textContent = 'Live';
                statusText.style.color = '#e2e8f0';
            });

            call.on('close', resetStream);
        });

        function resetStream() {
            placeholder.style.display = 'flex';
            videoEl.style.opacity = '0';
            videoEl.srcObject = null;
            statusDot.classList.remove('online');
            statusText.textContent = 'Offline';
            statusText.style.color = '#94a3b8';
        }
    </script>
</body>
</html>
